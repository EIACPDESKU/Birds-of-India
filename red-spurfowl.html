<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Combined Iframes</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styleb.css">
</head>
<body>
<div class="tabs">
    <button class="tab active" onclick="showFrame(1)">Photo</button>
    <button class="tab" onclick="showFrame(2)">Sound</button>
  </div>

  <div class="iframe-container">
    <iframe id="frame1" src="https://macaulaylibrary.org/asset/67534351/embed" allowfullscreen></iframe>
    <iframe id="frame2" src="https://macaulaylibrary.org/asset/75838281/embed" allowfullscreen style="display: none;"></iframe>
  </div>
    <div class="floating-btn">
        <button id="main-btn" onclick="toggleChildButton()">+</button>
        
        <!-- Child button -->
        <div id="child-btn" class="child-btn">
            <button onclick="window.location.href='index.html'">Back</button>
        </div>
        <div id="child-btnn" class="child-btn">
            <button onclick="window.location.href='index.html'">Next</button>
        </div>
    </div>
  <script>
    function showFrame(frameNumber) {
      const frames = document.querySelectorAll('iframe');
      const tabs = document.querySelectorAll('.tab');
      frames.forEach((frame, index) => {
        frame.style.display = index === frameNumber - 1 ? 'block' : 'none';
      });
      tabs.forEach((tab, index) => {
        tab.classList.toggle('active', index === frameNumber - 1);
      });
    }
// Function to toggle the visibility of the child button
function toggleChildButton() {
    var childBtn = document.getElementById('child-btn');
    childBtn.style.display = (childBtn.style.display === 'none' || childBtn.style.display === '') ? 'block' : 'none';
    var childBtn = document.getElementById('child-btnn');
    childBtn.style.display = (childBtn.style.display === 'none' || childBtn.style.display === '') ? 'block' : 'none';
}
  </script>
</body>
</html>
